<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Segoe UI, system-ui, sans-serif">
<title id="t">Kapalı veri döngüsü</title>
<desc id="d">Altı adımlı kapalı döngü şeması: fizik tabanlı simülasyon ortamından üretilen sentetik veri model eğitimine, oradan gerçek veriyle yapılan değerlendirmeye ve sahadaki robota aktarılıyor; gerçek dünyadan gelen geri besleme yeniden simülasyona dönerek halkayı kapatıyor.</desc>
